name: Vibe research adapter tests

on:
  pull_request:
    paths:
      - 'src/services/vibeResearchAdapter.js'
      - 'src/routes/internalVibeResearch.js'
      - 'scripts/testVibeResearchAdapter.js'
      - 'scripts/testVibeResearchHttp.js'
      - '.github/workflows/vibe-research-ci.yml'
  push:
    branches:
      - 'feat/vibe-readonly-pilot-20261025'
    paths:
      - 'src/services/vibeResearchAdapter.js'
      - 'src/routes/internalVibeResearch.js'
      - 'scripts/testVibeResearchAdapter.js'
      - 'scripts/testVibeResearchHttp.js'
      - '.github/workflows/vibe-research-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API test dependencies
        run: npm install --no-package-lock --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Research adapter and HTTP boundary tests
        run: node --test scripts/testVibeResearchAdapter.js scripts/testVibeResearchHttp.js
