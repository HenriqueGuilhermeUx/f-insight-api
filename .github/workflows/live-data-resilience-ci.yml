name: Live Data Resilience CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax validation
        run: |
          node --check src/server.js
          node --check src/services/dataSupabaseClient.js
          node --check src/services/userMarketPreferencesStore.js
          node --check src/services/liveDataService.js
          node --check src/routes/live.js
          node --check src/services/wooviBillingService.js
          node --check src/services/wooviWebhookVerifier.js
          node --check src/routes/billing.js
          node --check scripts/testLiveDataResilience.js

      - name: Memory fallback test
        run: npm run test:live-resilience

      - name: Billing webhook rejects unsigned payloads
        run: |
          node - <<'NODE'
          const { verifyWooviWebhook } = require('./src/services/wooviWebhookVerifier');
          verifyWooviWebhook({ rawBody: Buffer.from('{}'), signature: '' })
            .then((valid) => {
              if (valid !== false) process.exit(1);
              console.log('unsigned webhook rejected');
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE
