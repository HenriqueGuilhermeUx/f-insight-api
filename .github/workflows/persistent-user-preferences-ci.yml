name: Persistent User Preferences CI

on:
  push:
    branches:
      - main
      - feature/persistent-watchlist-alerts
      - feature/preferences-storage-health
      - fix/secure-contract-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax validation
        run: |
          node --check src/services/userMarketPreferencesStore.js
          node --check src/routes/watchlist.js
          node --check src/routes/alerts.js
          node --check src/server.js

      - name: Store ownership test
        run: npm run test:user-preferences

      - name: HTTP secure contract smoke test
        env:
          NODE_ENV: production
          ENABLE_CRON: 'false'
          PORT: '3213'
        run: |
          set -euo pipefail
          node src/server.js >/tmp/finsight-prefs.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/finsight-prefs.log || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3213/health >/dev/null; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3213/api/watchlist/_health/storage > /tmp/storage-health.json
          grep -q '"service":"user-market-preferences"' /tmp/storage-health.json
          grep -q '"access":"authenticated-owner-only"' /tmp/storage-health.json

          assert_blocked_without_auth() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local output="$4"
            if [ -n "$body" ]; then
              code=$(curl --silent --show-error -o "$output" -w "%{http_code}" -X "$method" -H 'Content-Type: application/json' -d "$body" "http://127.0.0.1:3213$path" || true)
            else
              code=$(curl --silent --show-error -o "$output" -w "%{http_code}" -X "$method" "http://127.0.0.1:3213$path" || true)
            fi

            # CI intentionally has no Supabase Auth configuration, so protected routes
            # must fail closed with 503 rather than accept arbitrary client-owned IDs.
            if [ "$code" != "503" ] && [ "$code" != "401" ]; then
              echo "$method $path should fail closed without auth; got HTTP $code"
              cat "$output" || true
              exit 1
            fi
          }

          assert_blocked_without_auth GET /api/watchlist/me '' /tmp/watchlist-me.json
          assert_blocked_without_auth POST /api/watchlist/me '{"ticker":"PETR4"}' /tmp/watchlist-post.json
          assert_blocked_without_auth POST /api/watchlist/ci-user '{"ticker":"PETR4"}' /tmp/watchlist-legacy.json
          assert_blocked_without_auth GET /api/alerts/me '' /tmp/alerts-me.json
          assert_blocked_without_auth POST /api/alerts '{"userId":"attacker-selected","ticker":"VALE3","type":"price_below","value":55.25}' /tmp/alerts-post.json
