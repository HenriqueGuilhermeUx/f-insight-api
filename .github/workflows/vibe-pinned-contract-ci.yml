name: Vibe provider pinned read-contract audit
on:
  pull_request:
    paths:
      - 'src/services/vibeResearchAdapter.js'
      - 'scripts/testVibeProviderContract.js'
      - '.github/workflows/vibe-pinned-contract-ci.yml'
  push:
    branches: ['feat/vibe-readonly-pilot-20261025']
    paths:
      - 'src/services/vibeResearchAdapter.js'
      - 'scripts/testVibeProviderContract.js'
      - '.github/workflows/vibe-pinned-contract-ci.yml'

permissions:
  contents: read

jobs:
  pinned-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download specific public source file at pinned commit
        run: |
          curl --fail --silent --show-error --location --max-time 25 \
            --output "$RUNNER_TEMP/vibe-alpha-routes.py" \
            "https://raw.githubusercontent.com/HKUDS/Vibe-Trading/3910bad3c9197de6c1fc6f28a3925ee8729c1a65/agent/src/api/alpha_routes.py"
          test "$(wc -c < "$RUNNER_TEMP/vibe-alpha-routes.py")" -lt 250000
      - name: Verify provider API and auth annotations
        run: node --test scripts/testVibeProviderContract.js "$RUNNER_TEMP/vibe-alpha-routes.py"
