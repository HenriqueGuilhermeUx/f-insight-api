name: Secret Hygiene

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Environment files must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Reject obvious backend secret literals
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -RInE --exclude='*.example' --exclude='*.md' --exclude-dir='.git' --exclude-dir='node_modules' '(sb_secret_[A-Za-z0-9._-]{12,}|CG-[A-Za-z0-9_-]{12,})' . || true)
          if [ -n "$matches" ]; then
            echo "Potential secret literal detected. Move it to deployment environment variables."
            echo "$matches" | sed -E 's/(sb_secret_|CG-)[A-Za-z0-9._-]+/REDACTED/g'
            exit 1
          fi
