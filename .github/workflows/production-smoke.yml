name: Production Smoke

on:
  push:
    branches:
      - main
      - ci/production-smoke
      - ci/shared-supabase-persistence-smoke
      - ci/market-universe-smoke
      - release/premium-entitlement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment and verify public API
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://f-insight-api.onrender.com"

          request_until_ok() {
            local path="$1"
            local output="$2"
            for attempt in {1..24}; do
              code=$(curl --silent --show-error --max-time 25 -o "$output" -w "%{http_code}" "$BASE$path" || true)
              if [ "$code" = "200" ]; then
                return 0
              fi
              echo "attempt $attempt: $path returned $code"
              sleep 5
            done
            echo "Timed out waiting for $path"
            cat "$output" || true
            return 1
          }

          request_until_ok "/health" /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          request_until_ok "/api/agent/health" /tmp/agent.json
          grep -q 'finsight-agent' /tmp/agent.json

          request_until_ok "/api/watchlist/_health/storage" /tmp/storage.json
          grep -q '"service":"user-market-preferences"' /tmp/storage.json
          grep -q '"storageMode":"dedicated-data-supabase-with-memory-fallback"' /tmp/storage.json
          grep -q '"access":"authenticated-owner-only"' /tmp/storage.json

          request_until_ok "/api/live/indicators" /tmp/indicators.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/indicators.json')); if (!Array.isArray(j.data) || j.data.length < 1) { console.error(j); process.exit(1) } console.log('indicator source:', j.source, 'count:', j.data.length)"

          request_until_ok "/api/news" /tmp/news.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/news.json')); if (!Array.isArray(j)) { console.error(j); process.exit(1) } console.log('news count:', j.length)"

      - name: Verify production billing and protected user data
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://f-insight-api.onrender.com"

          for attempt in {1..30}; do
            code=$(curl --silent --show-error --max-time 25 -o /tmp/billing-plans.json -w "%{http_code}" "$BASE/api/billing/plans" || true)
            if [ "$code" = "200" ] \
              && grep -q '"persistence":"dedicated-data-supabase"' /tmp/billing-plans.json \
              && grep -q '"id":"individual"' /tmp/billing-plans.json; then
              break
            fi
            echo "attempt $attempt: waiting for billing deployment (HTTP $code)"
            sleep 5
          done

          grep -q '"provider":"woovi"' /tmp/billing-plans.json
          grep -q '"persistence":"dedicated-data-supabase"' /tmp/billing-plans.json
          grep -q '"id":"individual"' /tmp/billing-plans.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/billing-plans.json')); const individual=j.plans?.find(x=>x.id==='individual'); if (!individual || individual.priceCents !== 1990) { console.error(j); process.exit(1) } console.log('Woovi configured:', Boolean(j.wooviConfigured), 'individual cents:', individual.priceCents)"

          assert_unauthorized() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local output="$4"
            if [ -n "$body" ]; then
              code=$(curl --silent --show-error --max-time 25 -o "$output" -w "%{http_code}" -X "$method" -H 'Content-Type: application/json' -d "$body" "$BASE$path" || true)
            else
              code=$(curl --silent --show-error --max-time 25 -o "$output" -w "%{http_code}" -X "$method" "$BASE$path" || true)
            fi
            if [ "$code" != "401" ]; then
              echo "$method $path must require authentication; got HTTP $code"
              cat "$output" || true
              exit 1
            fi
          }

          assert_unauthorized POST /api/billing/entitlement '{}' /tmp/entitlement-unauth.json
          assert_unauthorized POST /api/billing/checkout '{"planId":"individual"}' /tmp/checkout-unauth.json
          assert_unauthorized GET /api/watchlist/me '' /tmp/watchlist-unauth.json
          assert_unauthorized GET /api/alerts/me '' /tmp/alerts-unauth.json

          legacy_watchlist_code=$(curl --silent --show-error --max-time 25 -o /tmp/legacy-watchlist.json -w "%{http_code}" "$BASE/api/watchlist/arbitrary-user" || true)
          if [ "$legacy_watchlist_code" != "401" ]; then
            echo "Legacy watchlist user-id route must not be public: HTTP $legacy_watchlist_code"
            cat /tmp/legacy-watchlist.json || true
            exit 1
          fi

          webhook_code=$(curl --silent --show-error --max-time 25 -o /tmp/webhook-reject.json -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d '{"event":"OPENPIX:CHARGE_COMPLETED","charge":{"correlationID":"forged-ci","status":"COMPLETED"}}' \
            "$BASE/api/billing/webhooks/woovi" || true)

          if [ "$webhook_code" != "401" ]; then
            echo "Unsigned Woovi webhook was not rejected: HTTP $webhook_code"
            cat /tmp/webhook-reject.json || true
            exit 1
          fi

      - name: Verify production market universe beyond default B3 symbols
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://f-insight-api.onrender.com"

          curl --fail --silent --show-error --max-time 40 \
            "$BASE/api/live/indicators?symbols=AAPL%2CBTC-USD%2CIVVB11.SA%2CHGLG11.SA" \
            > /tmp/market-universe.json

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/market-universe.json', 'utf8'));
          if (!Array.isArray(payload.data)) {
            console.error(payload);
            process.exit(1);
          }
          const symbols = new Set(payload.data.map((row) => String(row.symbol || '').toUpperCase()));
          for (const required of ['AAPL', 'BTC-USD']) {
            if (!symbols.has(required)) {
              console.error('Missing required live symbol:', required, payload);
              process.exit(1);
            }
          }
          console.log('market universe source:', payload.source);
          console.log('market universe symbols:', [...symbols].join(', '));
          NODE

      - name: Verify production custom-domain CORS
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl --silent --show-error --max-time 25 -D - -o /dev/null -H "Origin: https://f-insight.org" https://f-insight-api.onrender.com/health)
          echo "$headers"
          echo "$headers" | tr -d '\r' | grep -qi '^access-control-allow-origin: https://f-insight.org$'
